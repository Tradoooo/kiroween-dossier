name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Licence présente et détectable
        run: test -s LICENSE
      - name: Sources présentes et non vides
        run: |
          test -s index.md
          test -s README.md
          for f in classement-usage classement-2mois classement-technique \
                   idees-usage idees-2mois idees-semaine \
                   DISQUETTE-cahier ROTA-cahier PARTIE-DOUBLE-cahier SEANCE-cahier \
                   cadre-concours consigne-2mois grille-notation; do
            test -s "src/$f.md" || { echo "source manquante : $f"; exit 1; }
          done
      - name: Le corpus contient bien les idées annoncées
        run: |
          n=$(grep -hcE '^[0-9]{2}\. ' src/idees-*.md | paste -sd+ | bc)
          echo "idées comptées : $n"
          test "$n" -ge 1000 || { echo "moins de 1000 idées : $n"; exit 1; }
      - name: Taille des fichiers de code
        run: |
          find tools -name '*.py' | while read -r f; do
            n=$(wc -l < "$f")
            test "$n" -lt 500 || { echo "$f dépasse 500 lignes ($n)"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "markdown==3.5.2"
      - name: Le générateur fonctionne
        run: python3 tools/build_site.py /tmp/site-ci && test -s /tmp/site-ci/index.html
